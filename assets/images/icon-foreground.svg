<!--
  Hidden Layer icon art on a transparent background: the node mascot (SPEC section 14) peeking over a stack of layers.
  Colors are the theme tokens tomato, teal, paper, ink and mustard (theme/colors.ts).
  Re-export after editing: rsvg-convert -w 1024 -h 1024 icon-foreground.svg -o icon-foreground.png
  Used as the Android adaptive icon foreground and as the splash image, so the
  art stays inside the central circle that both of them crop to.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <g transform="translate(512 512) scale(0.6) translate(-517 -520)">
    <!-- Feet sticking out under the layers. -->
    <ellipse cx="410" cy="868" rx="62" ry="44" fill="#E4572E" stroke="#1E1A16" stroke-width="30"/>
    <ellipse cx="600" cy="868" rx="62" ry="44" fill="#E4572E" stroke="#1E1A16" stroke-width="30"/>
    <!-- The node. -->
    <circle cx="500" cy="400" r="250" fill="#E4572E" stroke="#1E1A16" stroke-width="34"/>
    <ellipse cx="410" cy="345" rx="72" ry="88" fill="#F3E7CF" stroke="#1E1A16" stroke-width="26"/>
    <ellipse cx="590" cy="345" rx="72" ry="88" fill="#F3E7CF" stroke="#1E1A16" stroke-width="26"/>
    <circle cx="436" cy="368" r="36" fill="#1E1A16"/>
    <circle cx="616" cy="368" r="36" fill="#1E1A16"/>
    <!-- The layers it hides behind: two tilted stickers with hard shadows. -->
    <g transform="rotate(3 500 720)">
      <rect x="174" y="644" width="720" height="210" rx="60" fill="#1E1A16"/>
      <rect x="140" y="610" width="720" height="210" rx="60" fill="#17695D" stroke="#1E1A16" stroke-width="34"/>
    </g>
    <g transform="rotate(-4 500 570)">
      <rect x="164" y="494" width="740" height="220" rx="60" fill="#1E1A16"/>
      <rect x="130" y="460" width="740" height="220" rx="60" fill="#F3E7CF" stroke="#1E1A16" stroke-width="34"/>
    </g>
  </g>
</svg>
